name: Test Notebook Dependencies

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check imports
        run: |
          python -c "import fitz; print('✅ pymupdf:', fitz.__version__)"
          python -c "import groq; print('✅ groq ok')"
          python -c "import gradio; print('✅ gradio:', gradio.__version__)"

      - name: Check notebook exists
        run: |
          test -f Enterprise_PDF_Assistant_FREE.ipynb && echo "✅ Notebook found" || exit 1
